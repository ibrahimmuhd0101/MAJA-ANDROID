<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maja Social Media</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        /* ===== VARIABLES ===== */
        :root {
            --bg: #f0f2f5;
            --container-bg: #ffffff;
            --card-bg: #f8f9fa;
            --border: #e8eaed;
            --text: #202124;
            --text-secondary: #5f6368;
            --green: #1b5e20;
            --green-light: #e8f5e9;
            --green-hover: #2e7d32;
            --yellow: #f9a825;
            --shadow: 0 8px 24px rgba(0,0,0,0.10);
            --radius: 28px;
            --transition: 0.3s ease;
        }

        .dark-mode {
            --bg: #1a1a2e;
            --container-bg: #16213e;
            --card-bg: #1f2a4a;
            --border: #2a3a6a;
            --text: #e8e8e8;
            --text-secondary: #aab;
            --green: #4caf50;
            --green-light: #1a3a2a;
            --shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background var(--transition), color var(--transition), border var(--transition);
        }

        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .app-container {
            max-width: 420px;
            width: 100%;
            background: var(--container-bg);
            border-radius: var(--radius);
            padding: 20px 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        /* ===== AUTH ===== */
        .auth-section {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .auth-section.active {
            display: flex;
        }

        .auth-section input {
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        .auth-section input::placeholder {
            color: var(--text-secondary);
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .auth-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .auth-buttons .login-btn {
            background: var(--green);
            color: #fff;
        }

        .auth-buttons .login-btn:hover {
            background: var(--green-hover);
        }

        .auth-buttons .signup-btn {
            background: var(--yellow);
            color: #1e1e1e;
        }

        .auth-buttons .signup-btn:hover {
            opacity: 0.8;
        }

        .auth-status {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            padding: 8px;
        }

        .auth-status .logout-btn {
            background: #d32f2f;
            color: #fff;
            border: none;
            padding: 4px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }

        .auth-status .logout-btn:hover {
            background: #b71c1c;
        }

        .auth-status .user-email {
            color: var(--green);
            font-weight: 600;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-badge {
            background: linear-gradient(145deg, #2e7d32, #388e3c);
            color: #fff;
            font-weight: 700;
            font-size: 22px;
            padding: 6px 16px;
            border-radius: 40px;
            letter-spacing: 1px;
        }

        .logo-badge span {
            background: var(--yellow);
            padding: 2px 10px;
            border-radius: 30px;
            color: #1e1e1e;
            font-size: 14px;
            margin-left: 6px;
        }

        .thread-badge {
            background: var(--green-light);
            color: var(--green);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 40px;
        }

        .toggle-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dark-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 18px;
            color: var(--text);
            transition: var(--transition);
        }

        .dark-toggle:hover {
            transform: scale(1.05);
        }

        /* ===== SEARCH ===== */
        .search-box {
            background: var(--card-bg);
            border-radius: 60px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 14px;
            outline: none;
            color: var(--text);
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box .search-icon {
            color: var(--text-secondary);
            font-size: 18px;
        }

        /* ===== THREAD ===== */
        .thread-box {
            background: var(--card-bg);
            border-radius: 60px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
        }

        .thread-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 15px;
            outline: none;
            color: var(--text);
        }

        .thread-box input::placeholder {
            color: var(--text-secondary);
        }

        .thread-box button {
            background: var(--green);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .thread-box button:hover {
            background: var(--green-hover);
            transform: scale(1.02);
        }

        .thread-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px 10px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-card .num {
            font-size: 26px;
            font-weight: 700;
            color: var(--green);
        }

        .stat-card .label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-card.yellow .num {
            color: #e65100;
        }

        /* ===== CHART ===== */
        .chart-group {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .chart-group .title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
            margin-bottom: 10px;
        }

        .chart-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 60px;
        }

        .bar {
            flex: 1;
            background: #a5d6a7;
            border-radius: 12px 12px 4px 4px;
            height: 30px;
            transition: var(--transition);
            position: relative;
        }

        .bar:nth-child(2) { height: 48px; background: #66bb6a; }
        .bar:nth-child(3) { height: 22px; background: #c8e6c9; }
        .bar:nth-child(4) { height: 40px; background: #81c784; }
        .bar:nth-child(5) { height: 18px; background: #e8f5e9; }
        .bar:nth-child(6) { height: 52px; background: #4caf50; }

        .dark-mode .bar:nth-child(1) { background: #2e7d32; }
        .dark-mode .bar:nth-child(2) { background: #388e3c; }
        .dark-mode .bar:nth-child(3) { background: #1b5e20; }
        .dark-mode .bar:nth-child(4) { background: #2e7d32; }
        .dark-mode .bar:nth-child(5) { background: #1a3a2a; }
        .dark-mode .bar:nth-child(6) { background: #4caf50; }

        .bar-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 4px;
        }

        .group-chart {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 13px;
            color: var(--text);
            background: var(--green-light);
            padding: 8px 12px;
            border-radius: 30px;
        }

        .group-chart span:last-child {
            font-weight: 600;
            color: var(--green);
        }

        /* ===== BOT ===== */
        .bot-profile {
            background: #e3f2fd;
            border-radius: 40px;
            padding: 8px 18px;
            display: inline-block;
            font-size: 13px;
            font-weight: 500;
            color: #0d47a1;
            margin-bottom: 18px;
        }

        .dark-mode .bot-profile {
            background: #1a2a4a;
            color: #64b5f6;
        }

        /* ===== FRIEND LIST ===== */
        .friend-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .friend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 60px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .friend-item:hover {
            background: var(--border);
        }

        .friend-item.hidden {
            display: none;
        }

        .friend-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
        }

        .friend-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .add-btn {
            background: var(--green);
            color: #fff;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-btn:hover {
            background: var(--green-hover);
            transform: scale(1.02);
        }

        .add-btn.added {
            background: #9e9e9e;
            cursor: default;
        }

        .add-btn.added:hover {
            transform: none;
        }

        .delete-btn {
            background: #d32f2f;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .delete-btn:hover {
            background: #b71c1c;
            transform: scale(1.02);
        }

        .delete-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            background: var(--green);
            color: #fff;
            padding: 10px 16px;
            border-radius: 40px;
            text-align: center;
            margin-bottom: 14px;
            font-weight: 500;
            font-size: 14px;
            display: none;
            animation: slideDown 0.4s ease;
        }

        .notification.show {
            display: block;
        }

        .notification.error {
            background: #d32f2f;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        /* ===== FOOTER ===== */
        .footer-note {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .footer-note span {
            color: var(--green);
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app-container {
                padding: 16px 12px;
                border-radius: 20px;
            }
            .logo-badge {
                font-size: 18px;
                padding: 4px 12px;
            }
            .thread-badge {
                font-size: 11px;
                padding: 4px 10px;
            }
            .stat-card .num {
                font-size: 20px;
            }
            .friend-item {
                padding: 10px 12px;
                border-radius: 40px;
            }
            .add-btn {
                padding: 4px 12px;
                font-size: 10px;
            }
            .delete-btn {
                padding: 4px 10px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <!-- ===== NOTIFICATION ===== -->
        <div class="notification" id="notification"></div>

        <!-- ===== AUTH SECTION ===== -->
        <div class="auth-section active" id="authSection">
            <input type="email" id="emailInput" placeholder="Email address..." />
            <input type="password" id="passwordInput" placeholder="Password..." />
            <div class="auth-buttons">
                <button class="login-btn" id="loginBtn">🔑 Login</button>
                <button class="signup-btn" id="signupBtn">📝 Sign Up</button>
            </div>
            <div class="auth-status" id="authStatus">
                👤 Not signed in
            </div>
        </div>

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-badge">
                    MAJA <span>social</span>
                </div>
                <div class="thread-badge">📌 Threads</div>
            </div>
            <div class="toggle-area">
                <button class="dark-toggle" id="darkToggle" title="Canza launi">🌙</button>
            </div>
        </div>

        <!-- ===== SEARCH ===== -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search friends..." id="searchInput" />
        </div>

        <!-- ===== THREAD ===== -->
        <div class="thread-box">
            <input type="text" placeholder="Add friend by username..." id="threadInput" />

        </div>

        <!-- ===== STATS ===== -->
        <div class="stats">
            <div class="stat-card">
                <div class="num" id="threadCount">0</div>
                <div class="label">new thread</div>
            </div>
            <div class="stat-card yellow">
                <div class="num" id="friendCount">0</div>
                <div class="label">friend online</div>
            </div>
        </div>

        <!-- ===== CHART ===== -->
        <div class="chart-group">
            <div class="title">📊 Chart + group chart</div>
            <div class="chart-row">
                <div style="flex:1; text-align:center;"><div class="bar"></div><div class="bar-label">M</div></div>
                <div style="flex:1; text-align:center;"><div class="bar"></div><div class="bar-label">T</div></div>
                <div style="flex:1; text-align:center;"><div class="bar"></div><div class="bar-label">W</div></div>
                <div style="flex:1; text-align:center;"><div class="bar"></div><div class="bar-label">T</div></div>
                <div style="flex:1; text-align:center;"><div class="bar"></div><div class="bar-label">F</div></div>
                <div style="flex:1; text-align:center;"><div class="bar"></div><div class="bar-label">S</div></div>
            </div>
            <div class="group-chart">
                <span>👥 Group online: 12</span>
                <span>📈 +8 active</span>
            </div>
        </div>

        <!-- ===== BOT ===== -->
        <div class="bot-profile">🤖 Bot on profile — @maja_bot</div>

        <!-- ===== FRIEND LIST ===== -->
        <div class="friend-list" id="friendList">
            <div class="loading" id="loadingFriends">Loading friends</div>
        </div>

        <div class="footer-note">
            <span>Maja</span> · Social · v3.0 (Firebase)
        </div>
    </div>

    <script>
        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyARNIMr9CLKIFOt6AONAa4fYz-pe28yX4I",
            authDomain: "maja-ae9d0.firebaseapp.com",
            projectId: "maja-ae9d0",
            storageBucket: "maja-ae9d0.firebasestorage.app",
            messagingSenderId: "21674614341",
            appId: "1:21674614341:web:2f63073f1d0e1c3df04d2c"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==========================================
        // DOM REFERENCES
        // ==========================================
        const notif = document.getElementById('notification');
        const authSection = document.getElementById('authSection'
