<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA Social</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--card:#ffffff;--border:#e0e0e0;
  --text:#1a1a2e;--muted:#6b7280;
  --primary:#2563eb;--primary-dark:#1d4ed8;
  --danger:#dc2626;--success:#16a34a;
  --shadow:0 2px 12px rgba(0,0,0,0.08)
}
body{background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;color:var(--text)}
.app{max-width:1200px;margin:0 auto;min-height:100vh}

/* HEADER */
.header{background:var(--card);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{font-size:28px;font-weight:900;letter-spacing:2px;color:var(--text)}
.logo span{color:var(--primary)}
.header-right{display:flex;align-items:center;gap:12px}
.profile-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;cursor:pointer;overflow:hidden;border:2px solid var(--primary)}
.profile-avatar img{width:100%;height:100%;object-fit:cover}

/* NAV */
.nav{background:var(--card);display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.nav-btn{padding:14px 24px;border:none;background:transparent;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav-btn.active{color:var(--text);border-bottom-color:var(--primary)}

/* MAIN LAYOUT */
.main{display:grid;grid-template-columns:1fr 320px;gap:0;min-height:calc(100vh - 120px)}
.feed{padding:16px;background:var(--bg)}
.sidebar{background:var(--card);padding:16px;border-left:1px solid var(--border)}

/* COMPOSER */
.composer{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.composer textarea{width:100%;min-height:70px;border:none;outline:none;resize:vertical;font-size:15px;font-family:inherit;padding:4px 0}
.composer-actions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px;margin-top:6px}
.composer-actions label{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.composer-actions label input{display:none}
.btn-primary{background:var(--primary);color:#fff;border:none;padding:8px 22px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-danger:hover{opacity:0.8}

/* POST */
.post{background:var(--card);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.post-header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post-avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;overflow:hidden;flex-shrink:0}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.post-user{flex:1}
.post-user .name{font-weight:700;font-size:15px;cursor:pointer}
.post-user .name:hover{color:var(--primary)}
.post-user .time{font-size:12px;color:var(--muted)}
.post-text{padding:0 14px 10px;line-height:1.6;font-size:15px}
.post-image{width:100%;max-height:400px;object-fit:cover;display:block}
.post-stats{display:flex;gap:18px;padding:8px 14px;color:var(--muted);font-size:13px;border-top:1px solid var(--border)}
.post-actions{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border)}
.post-actions button{padding:10px;border:none;background:transparent;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.post-actions button:hover{background:var(--bg)}
.post-actions button.liked{color:var(--danger)}

/* COMMENTS */
.comment-section{padding:10px 14px;border-top:1px solid var(--border);background:#fafafa;display:none}
.comment-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #eee}
.comment-item .avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden}
.comment-item .avatar img{width:100%;height:100%;object-fit:cover}
.comment-item .text{flex:1}
.comment-item .text .name{font-weight:700;font-size:13px}
.comment-item .text p{margin:2px 0 0;font-size:13px}
.comment-input-row{display:flex;gap:8px;padding-top:8px}
.comment-input-row input{flex:1;border:1px solid var(--border);border-radius:20px;padding:8px 14px;outline:none;font-size:13px}
.comment-input-row button{background:var(--primary);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:13px}
.comment-input-row button:hover{background:var(--primary-dark)}

/* SEARCH & USERS */
.search-box{display:flex;gap:8px;margin-bottom:14px}
.search-box input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:30px;outline:none;font-size:14px}
.search-box button{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:30px;font-weight:700;cursor:pointer}
.user-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.user-item:hover{background:var(--bg);border-radius:8px}
.user-item .info{display:flex;align-items:center;gap:10px}
.user-item .info .avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0}
.user-item .info .avatar img{width:100%;height:100%;object-fit:cover}
.user-item .info .name{font-weight:600;font-size:14px}
.user-item .info .username{font-size:12px;color:var(--muted)}
.btn-add{background:var(--primary);color:#fff;border:none;padding:4px 14px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer}
.btn-add:hover{background:var(--primary-dark)}
.btn-add.added{background:#9ca3af;cursor:default}

/* CHAT */
.chat-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:8px}
.chat-item:hover{background:var(--bg)}
.chat-item .avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0}
.chat-item .avatar img{width:100%;height:100%;object-fit:cover}
.chat-item .info{flex:1}
.chat-item .info .name{font-weight:600;font-size:14px}
.chat-item .info .last{font-size:12px;color:var(--muted)}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.modal .close{float:right;border:none;background:#f0f0f0;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer}
.modal h2{margin-top:0}
.modal .field{margin-bottom:14px}
.modal .field label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.modal .field input,.modal .field select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;outline:none;font-size:14px}
.modal .field select{appearance:auto}
.modal .avatar-upload{text-align:center;margin-bottom:16px}
.modal .avatar-upload .avatar{width:80px;height:80px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 8px;overflow:hidden}
.modal .avatar-upload .avatar img{width:100%;height:100%;object-fit:cover}
.modal .avatar-upload label{display:inline-block;background:var(--primary);color:#fff;padding:6px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.modal .avatar-upload label input{display:none}
.modal .btn-row{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.modal .btn-row .btn-primary{width:100%;text-align:center}
.modal .btn-row .btn-danger{width:100%;text-align:center}

/* CHAT WINDOW */
.chat-window{max-width:560px;height:500px;display:flex;flex-direction:column}
.chat-window .messages{flex:1;overflow-y:auto;padding:12px;background:#f8f9fa;border-radius:8px;margin:8px 0}
.chat-window .messages .msg{padding:8px 14px;border-radius:16px;margin:4px 0;max-width:80%;font-size:14px}
.chat-window .messages .msg.me{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.chat-window .messages .msg.other{background:#fff;border:1px solid var(--border);margin-right:auto;border-bottom-left-radius:4px}
.chat-window .chat-input{display:flex;gap:8px}
.chat-window .chat-input input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:30px;outline:none}
.chat-window .chat-input button{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:30px;font-weight:700;cursor:pointer}

/* SETTINGS */
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.toggle{width:44px;height:24px;background:#d1d5db;border-radius:12px;border:none;position:relative;cursor:pointer}
.toggle.on{background:var(--primary)}
.toggle:after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:0.2s}
.toggle.on:after{left:23px}

/* NOTIFICATION */
#notification{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 28px;border-radius:40px;z-index:9999;display:none;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.2);max-width:90%;text-align:center}

/* RESPONSIVE */
@media(max-width:768px){
  .main{grid-template-columns:1fr}
  .sidebar{display:none}
  .header{padding:10px 14px}
  .logo{font-size:22px}
  .nav-btn{padding:10px 14px;font-size:13px}
  .feed{padding:10px}
}
</style>
</head>
<body>

<div id="notification"></div>

<div class="app">
  <!-- HEADER -->
  <header class="header">
    <div class="logo">MAJA<span>.</span></div>
    <div class="header-right">
      <button class="profile-avatar" onclick="openProfile()" id="topAvatar">M</button>
    </div>
  </header>

  <!-- NAV -->
  <nav class="nav" id="mainNav">
    <button class="nav-btn active" data-tab="thread" onclick="switchTab('thread')">📝 Thread</button>
    <button class="nav-btn" data-tab="friends" onclick="switchTab('friends')">👥 Friends</button>
    <button class="nav-btn" data-tab="chat" onclick="switchTab('chat')">💬 Chat</button>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <!-- THREAD TAB -->
    <div class="feed" id="tab-thread">
      <div class="composer">
        <textarea id="postText" placeholder="What's on your mind?"></textarea>
        <div class="composer-actions">
          <label>📷 <span>Add Photo</span><input type="file" accept="image/*" id="imageInput" onchange="previewImage(event)"></label>
          <button class="btn-primary" onclick="createPost()">Post</button>
        </div>
        <img id="previewImg" style="max-width:100%;max-height:200px;margin-top:8px;display:none;border-radius:8px">
      </div>
      <div id="postsContainer"><div class="empty" style="text-align:center;padding:40px;color:var(--muted)">Loading posts...</div></div>
    </div>

    <!-- FRIENDS TAB -->
    <div class="feed" id="tab-friends" style="display:none">
      <h3 style="margin-bottom:12px">👥 Find Friends</h3>
      <div class="search-box">
        <input id="searchInput" placeholder="Search by name or username..." onkeyup="searchUsers()">
        <button onclick="searchUsers()">Search</button>
      </div>
      <div id="usersList"><div class="empty" style="text-align:center;padding:30px;color:var(--muted)">Loading users...</div></div>
    </div>

    <!-- CHAT TAB -->
    <div class="feed" id="tab-chat" style="display:none">
      <h3 style="margin-bottom:12px">💬 Chats</h3>
      <div id="chatList"><div class="empty" style="text-align:center;padding:30px;color:var(--muted)">No friends yet. Add friends to chat!</div></div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <h3 style="margin-bottom:12px;font-size:16px">💬 Quick Chat</h3>
      <div id="sidebarChats"><div style="color:var(--muted);font-size:14px">No friends online</div></div>
    </div>
  </div>

  <!-- SETTINGS BUTTON -->
  <button style="position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:50%;width:50px;height:50px;font-size:22px;box-shadow:var(--shadow);cursor:pointer;z-index:50" onclick="openSettings()">⚙</button>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ==========================================
// FIREBASE CONFIG
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyARNIMr9CLKIFOt6AONAa4fYz-pe28yX4I",
  authDomain: "maja-ae9d0.firebaseapp.com",
  projectId: "maja-ae9d0",
  storageBucket: "maja-ae9d0.firebasestorage.app",
  messagingSenderId: "21674614341",
  appId: "1:21674614341:web:2f63073f1d0e1c3df04d2c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ==========================================
// STATE
// ==========================================
let currentUser = null;
let userData = { username: 'User', displayName: 'User', avatar: '', gender: 'Male' };
let posts = [];
let allUsers = [];
let friends = [];
let currentTab = 'thread';

// ==========================================
// AUTH - REDIRECT IF NOT LOGGED IN
// ==========================================
auth.onAuthStateChanged(async function(user) {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  currentUser = user;
  await loadUserProfile();
  await loadPosts();
  await loadAllUsers();
  await loadFriends();
  updateUI();
});

// ==========================================
// LOAD USER PROFILE
// ==========================================
async function loadUserProfile() {
  try {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists) {
      userData = doc.data();
    } else {
      const username = currentUser.email.split('@')[0] || 'User';
      userData = { username, displayName: username, avatar: '', gender: 'Male' };
      await db.collection('users').doc(currentUser.uid).set({
        ...userData,
        email: currentUser.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    updateAvatar();
  } catch (e) { console.error('Error loading profile:', e); }
}

function updateAvatar() {
  const el = document.getElementById('topAvatar');
  if (userData.avatar) {
    el.innerHTML = `<img src="${userData.avatar}" alt="">`;
  } else {
    el.textContent = (userData.displayName || 'U').charAt(0).toUpperCase();
  }
}

// ==========================================
// LOAD POSTS
// ==========================================
async function loadPosts() {
  try {
    const snap = await db.collection('posts').orderBy('createdAt', 'desc').limit(50).get();
    posts = [];
    for (const doc of snap.docs) {
      const data = doc.data();
      const commentsSnap = await db.collection('posts').doc(doc.id).collection('comments').orderBy('createdAt', 'desc').limit(20).get();
      const comments = [];
      commentsSnap.forEach(c => comments.push({ id: c.id, ...c.data() }));
      posts.push({ id: doc.id, ...data, commentsList: comments });
    }
    renderPosts();
  } catch (e) { console.error('Error loading posts:', e); }
}

// ==========================================
// RENDER POSTS
// ==========================================
function renderPosts() {
  const container = document.getElementById('postsContainer');
  if (!posts.length) {
    container.innerHTML = '<div class="empty" style="text-align:center;padding:40px;color:var(--muted)">No posts yet. Be the first!</div>';
    return;
  }
  container.innerHTML = posts.map(p => `
    <div class="post">
      <div class="post-header">
        <div class="post-avatar" onclick="viewUser('${p.userId}')" style="cursor:pointer">
          ${p.userAvatar ? `<img src="${p.userAvatar}">` : (p.user || 'U').charAt(0).toUpperCase()}
        </div>
        <div class="post-user">
          <div class="name" onclick="viewUser('${p.userId}')">${esc(p.user || 'Unknown')}</div>
          <div class="time">${p.timeAgo || 'just now'}</div>
        </div>
        ${p.userId === currentUser?.uid ? `<button class="btn-danger" style="padding:4px 12px;font-size:12px" onclick="deletePost('${p.id}')">✕</button>` : ''}
      </div>
      <div class="post-text">${esc(p.text || '')}</div>
      ${p.image ? `<img class="post-image" src="${p.image}" alt="Post image">` : ''}
      <div class="post-stats">
        <span>❤️ ${p.likes || 0}</span>
        <span>💬 ${p.comments || 0}</span>
        <span>🔄 ${p.reposts || 0}</span>
      </div>
      <div class="post-actions">
        <button class="${p.liked ? 'liked' : ''}" onclick="likePost('${p.id}')">❤️ Like</button>
        <button onclick="toggleComments('${p.id}')">💬 Comment</button>
        <button onclick="repostPost('${p.id}')">🔄 Repost</button>
      </div>
      <div class="comment-section" id="comments-${p.id}">
        ${(p.commentsList || []).map(c => `
          <div class="comment-item">
            <div class="avatar">${c.userAvatar ? `<img src="${c.userAvatar}">` : (c.user || 'U').charAt(0).toUpperCase()}</div>
            <div class="text">
              <div class="name">${esc(c.user || 'Unknown')}</div>
              <p>${esc(c.text || '')}</p>
            </div>
          </div>
        `).join('')}
        ${(p.commentsList || []).length === 0 ? '<div style="color:var(--muted);font-size:13px;padding:4px 0">No comments yet</div>' : ''}
        <div class="comment-input-row">
          <input id="comment-input-${p.id}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter') addComment('${p.id}')">
          <button onclick="addComment('${p.id}')">Send</button>
        </div>
      </div>
    </div>
  `).join('');
}

function esc(s) { return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]); }

// ==========================================
// CREATE POST
// ==========================================
async function createPost() {
  const text = document.getElementById('postText').value.trim();
  const preview = document.getElementById('previewImg');
  const image = preview.dataset.image || '';
  if (!text && !image) { showNotification('Please write something or add a photo'); return; }
  
  try {
    await db.collection('posts').add({
      userId: currentUser.uid,
      user: userData.displayName || userData.username,
      userAvatar: userData.avatar || '',
      text: text || '📷 Photo post',
      image: image,
      likes: 0,
      comments: 0,
      reposts: 0,
      liked: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('postText').value = '';
    preview.src = '';
    preview.dataset.image = '';
    preview.style.display = 'none';
    document.getElementById('imageInput').value = '';
    await loadPosts();
    showNotification('✅ Post created!');
  } catch (e) { alert('Error: ' + e.message); }
}

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    const img = document.getElementById('previewImg');
    img.src = reader.result;
    img.dataset.image = reader.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

// ==========================================
// LIKE POST
// ==========================================
async function likePost(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  const newLiked = !p.liked;
  try {
    await db.collection('posts').doc(id).update({
      likes: p.likes + (newLiked ? 1 : -1),
      liked: newLiked
    });
    p.liked = newLiked;
    p.likes += newLiked ? 1 : -1;
    renderPosts();
  } catch (e) { console.error(e); }
}

// ==========================================
// REPOST
// ==========================================
async function repostPost(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  try {
    await db.collection('posts').doc(id).update({
      reposts: (p.reposts || 0) + 1
    });
    p.reposts = (p.reposts || 0) + 1;
    renderPosts();
    showNotification('✅ Reposted!');
  } catch (e) { console.error(e); }
}

// ==========================================
// TOGGLE COMMENTS
// ==========================================
function toggleComments(id) {
  const el = document.getElementById('comments-' + id);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
  if (el.style.display === 'block') {
    const input = document.getElementById('comment-input-' + id);
    if (input) input.focus();
  }
}

// ==========================================
// ADD COMMENT
// ==========================================
async function addComment(id) {
  const input = document.getElementById('comment-input-' + id);
  if (!input || !input.value.trim()) return;
  const text = input.value.trim();
  const p = posts.find(x => x.id === id);
  if (!p) return;
  
  try {
    await db.collection('posts').doc(id).collection('comments').add({
      userId: currentUser.uid,
      user: userData.displayName || userData.username,
      userAvatar: userData.avatar || '',
      text: text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('posts').doc(id).update({
      comments: firebase.firestore.FieldValue.increment(1)
    });
    p.comments = (p.comments || 0) + 1;
    input.value = '';
    await loadPosts();
    showNotification('✅ Comment added!');
  } catch (e) { alert('Error: ' + e.message); }
}

// ==========================================
// DELETE POST
// ==========================================
async function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  try {
    const comments = await db.collection('posts').doc(id).collection('comments').get();
    for (const c of comments.docs) await c.ref.delete();
    await db.collection('posts').doc(id).delete();
    await loadPosts();
    showNotification('✅ Post deleted');
  } catch (e) { alert('Error: ' + e.message); }
}

// ==========================================
// LOAD ALL USERS
// ==========================================
async function loadAllUsers() {
  try {
    const snap = await db.collection('users').get();
    allUsers = [];
    snap.forEach(doc => {
      if (doc.id !== currentUser?.uid) {
        allUsers.push({ id: doc.id, ...doc.data() });
      }
    });
    renderUsers(allUsers);
  } catch (e) { console.error(e); }
}

function renderUsers(users) {
  const container = document.getElementById('usersList');
  if (!users || !users.length) {
    container.innerHTML = '<div class="empty" style="text-align:center;padding:30px;color:var(--muted)">No users found</div>';
    return;
  }
  container.innerHTML = users.map(u => {
    const isFriend = friends.some(f => f.id === u.id);
    return `
      <div class="user-item">
        <div class="info" onclick="viewUser('${u.id}')">
          <div class="avatar">${u.avatar ? `<img src="${u.avatar}">` : (u.displayName || 'U').charAt(0).toUpperCase()}</div>
          <div>
            <div class="name">${esc(u.displayName || u.username)}</div>
            <div class="username">@${esc(u.username)} ${u.gender === 'Female' ? '♀' : '♂'}</div>
          </div>
        </div>
        <button class="btn-add ${isFriend ? 'added' : ''}" onclick="toggleFriend('${u.id}','${esc(u.displayName || u.username)}')">
          ${isFriend ? '✓ Friend' : '+ Add'}
        </button>
      </div>
    `;
  }).join('');
}

// ==========================================
// SEARCH USERS
// ==========================================
function searchUsers() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!query) { renderUsers(allUsers); return; }
  const filtered = allUsers.filter(u => 
    (u.displayName || '').toLowerCase().includes(query) || 
    (u.username || '').toLowerCase().includes(query)
  );
  renderUsers(filtered);
}

// ==========================================
// LOAD FRIENDS
// ==========================================
async function loadFriends() {
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('friends').get();
    friends = [];
    snap.forEach(doc => friends.push({ id: doc.id, ...doc.data() }));
    renderChats();
  } catch (e) { console.error(e); }
}

// ==========================================
// TOGGLE FRIEND
// ==========================================
async function toggleFriend(userId, name) {
  const isFriend = friends.some(f => f.id === userId);
  try {
    if (isFriend) {
      await db.collection('users').doc(currentUser.uid).collection('friends').doc(userId).delete();
      friends = friends.filter(f => f.id !== userId);
      showNotification('❌ Removed ' + name);
    } else {
      await db.collection('users').doc(currentUser.uid).collection('friends').doc(userId).set({
        name: name,
        addedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      friends.push({ id: userId, name: name });
      showNotification('✅ Added ' + name + ' as friend!');
    }
    renderUsers(allUsers);
    renderChats();
  } catch (e) { alert('Error: ' + e.message); }
}

// ==========================================
// VIEW USER PROFILE
// ==========================================
async function viewUser(userId) {
  try {
    const doc = await db.collection('users').doc(userId).get();
    if (!doc.exists) return;
    const data = doc.data();
    const isFriend = friends.some(f => f.id === userId);
    openModal(`
      <button class="close" onclick="closeModal()">✕</button>
      <h2>👤 ${esc(data.displayName || data.username)}</h2>
      <div style="text-align:center">
        <div class="avatar" style="width:80px;height:80px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 8px;overflow:hidden">
          ${data.avatar ? `<img src="${data.avatar}" style="width:100%;height:100%;object-fit:cover">` : (data.displayName || 'U').charAt(0).toUpperCase()}
        </div>
        <div style="font-size:14px;color:var(--muted)">@${esc(data.username)} ${data.gender === 'Female' ? '♀' : '♂'}</div>
      </div>
      <button class="btn-add ${isFriend ? 'added' : ''}" style="width:100%;padding:10px;font-size:16px;border-radius:8px;margin-top:12px" onclick="toggleFriend('${userId}','${esc(data.displayName || data.username)}')">
        ${isFriend ? '✓ Friend' : '+ Add Friend'}
      </button>
    `);
  } catch (e) { console.error(e); }
}

// ==========================================
// RENDER CHATS
// ==========================================
function renderChats() {
  const container = document.getElementById('chatList');
  const sidebar = document.getElementById('sidebarChats');
  
  if (!friends.length) {
    container.innerHTML = '<div class="empty" style="text-align:center;padding:30px;color:var(--muted)">No friends yet. Add friends to chat!</div>';
    sidebar.innerHTML = '<div style="color:var(--muted);font-size:14px">No friends online</div>';
    return;
  }
  
  const html = friends.map(f => `
    <div class="chat-item" onclick="openChat('${f.id}','${esc(f.name)}')">
      <div class="avatar">${f.avatar ? `<img src="${f.avatar}">` : f.name.charAt(0).toUpperCase()}</div>
      <div class="info">
        <div class="name">${esc(f.name)}</div>
        <div class="last">${f.online ? '<span class="online-dot"></span> Online' : 'Offline'}</div>
      </div>
    </div>
  `).join('');
  
  container.innerHTML = html;
  sidebar.innerHTML = html.slice(0, 300) || '<div style="color:var(--muted);font-size:14px">No friends online</div>';
}

// ==========================================
// OPEN CHAT
// ==========================================
function openChat(userId, name) {
  openModal(`
    <button class="close" onclick="closeModal()">✕</button>
    <h2>💬 ${esc(name)}</h2>
    <div class="chat-window" style="height:400px">
      <div class="messages" id="chatMessages">
        <div class="msg other">Hello 👋</div>
        <div class="msg other">Welcome to MAJA!</div>
      </div>
      <div class="chat-input">
        <input id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
        <button onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  `);
}

function sendChatMessage() {
  const input = document.getElementById('chatInput');
  if (!input || !input.value.trim()) return;
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg me';
  div.textContent = input.value;
  msgs.appendChild(div);
  input.value = '';
  msgs.scrollTop = msgs.scrollHeight;
  setTimeout(() => {
    const r = document.createElement('div');
    r.className = 'msg other';
    r.textContent = 'Okay, I see 👍';
    msgs.appendChild(r);
    msgs.scrollTop = msgs.scrollHeight;
  }, 600);
}

// ==========================================
// SWITCH TAB
// ==========================================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add('active');
  
  document.getElementById('tab-thread').style.display = tab === 'thread' ? 'block' : 'none';
  document.getElementById('tab-friends').style.display = tab === 'friends' ? 'block' : 'none';
  document.getElementById('tab-chat').style.display = tab === 'chat' ? 'block' : 'none';
  
  if (tab === 'friends') loadAllUsers();
  if (tab === 'chat') renderChats();
}

// ==========================================
// PROFILE
// ==========================================
function openProfile() {
  openModal(`
    <button class="close" onclick="closeModal()">✕</button>
    <h2>👤 My Profile</h2>
    <div class="avatar-upload">
      <div class="avatar" id="profileAvatar">
        ${userData.avatar ? `<img src="${userData.avatar}">` : (userData.displayName || 'U').charAt(0).toUpperCase()}
      </div>
      <label>📷 Change Photo <input type="file" accept="image/*" onchange="changeProfilePic(event)"></label>
    </div>
    <div class="field">
      <label>Username</label>
      <input id="profileUsername" value="${esc(userData.displayName || userData.username)}">
    </div>
    <div class="field">
      <label>Gender</label>
      <select id="profileGender">
        <option value="Male" ${userData.gender === 'Male' ? 'selected' : ''}>♂ Male</option>
        <option value="Female" ${userData.gender === 'Female' ? 'selected' : ''}>♀ Female</option>
        <option value="Other" ${userData.gender === 'Other' ? 'selected' : ''}>⚧ Other</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="saveProfile()">💾 Save Profile</button>
      <button class="btn-danger" onclick="logout()">🚪 Logout</button>
      <button class="btn-danger" onclick="deleteAccount()">🗑️ Delete Account</button>
    </div>
  `);
}

// ==========================================
// CHANGE PROFILE PICTURE
// ==========================================
function changeProfilePic(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function() {
    const imgData = reader.result;
    try {
      await db.collection('users').doc(currentUser.uid).update({ avatar: imgData });
      userData.avatar = imgData;
      document.getElementById('profileAvatar').innerHTML = `<img src="${imgData}">`;
      updateAvatar();
      showNotification('✅ Profile picture updated!');
    } catch (err) { alert('Error: ' + err.message); }
  };
  reader.readAsDataURL(file);
}

// ==========================================
// SAVE PROFILE
// ==========================================
async function saveProfile() {
  const name = document.getElementById('profileUsername').value.trim();
  const gender = document.getElementById('profileGender').value;
  if (!name) { showNotification('Please enter a username'); return; }
  
  try {
    await db.collection('users').doc(currentUser.uid).update({
      displayName: name,
      username: name.toLowerCase(),
      gender: gender
    });
    userData.displayName = name;
    userData.username = name.toLowerCase();
    userData.gender = gender;
    updateAvatar();
    closeModal();
    await loadPosts();
    await loadAllUsers();
    showNotification('✅ Profile saved!');
  } catch (e) { alert('Error: ' + e.message); }
}

// ==========================================
// LOGOUT
// ==========================================
function logout() {
  if (confirm('Are you sure you want to logout?')) {
    auth.signOut().then(() => window.location.href = 'login.html');
  }
}

// ==========================================
// DELETE ACCOUNT
// ==========================================
async function deleteAccount() {
  if (!confirm('⚠️ Delete your account? This cannot be undone!')) return;
  try {
    const posts = await db.collection('posts').where('userId', '==', currentUser.uid).get();
    for (const p of posts.docs) {
      const comments = await db.collection('posts').doc(p.id).collection('comments').get();
      for (const c of comments.docs) await c.ref.delete();
      await p.ref.delete();
    }
    await db.collection('users').doc(currentUser.uid).delete();
    await currentUser.delete();
    showNotification('✅ Account deleted');
    window.location.href = 'login.html';
  } catch (e) { alert('Error: ' + e.message); }
}

// ==========================================
// SETTINGS
// ==========================================
function openSettings() {
  openModal(`
    <button class="close" onclick="closeModal()">✕</button>
    <h2>⚙ Settings</h2>
    <div class="setting-row">
      <span>🔔 Notifications</span>
      <button class="toggle on" onclick="this.classList.toggle('on')"></button>
    </div>
    <div class="setting-row">
      <span>🔊 Sound</span>
      <button class="toggle on" onclick="this.classList.toggle('on')"></button>
    </div>
    <div class="setting-row">
      <span>🌙 Dark Mode</span>
      <button class="toggle" onclick="toggleDarkMode(this)"></button>
    </div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn-danger" onclick="logout()">🚪 Logout</button>
    </div>
  `);
}

function toggleDarkMode(btn) {
  btn.classList.toggle('on');
  document.body.style.background = btn.classList.contains('on') ? '#1a1a2e' : '#f0f2f5';
}

// ==========================================
// MODAL HELPERS
// ==========================================
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

// ==========================================
// NOTIFICATION
// ==========================================
function showNotification(msg) {
  const el = document.getElementById('notification');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

// ==========================================
// UPDATE UI
// ==========================================
function updateUI() {
  updateAvatar();
  renderPosts();
  renderUsers(allUsers);
  renderChats();
}
