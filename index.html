<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA Social</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f7fb;--card:#fff;--line:#dfe4ec;--text:#172033;--muted:#718096;
  --blue:#315efb;--blue2:#2448cf;--danger:#e34b4b;--shadow:0 8px 25px rgba(20,35,70,.07)
}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:auto;min-height:100vh;background:var(--bg)}
.topbar{
  height:92px;background:var(--card);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:0 18px;
  position:sticky;top:0;z-index:20
}
.logo-profile{
  width:64px;height:64px;border:2px solid #202b44;border-radius:18px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;
  font-size:32px;line-height:25px;cursor:pointer;overflow:hidden
}
.logo-profile img{width:100%;height:100%;object-fit:cover}
.logo-profile small{font-size:10px;font-weight:700}
.brand{text-align:center;font-size:30px;font-weight:800;letter-spacing:4px}
.notify{justify-self:end;width:52px;height:52px;border:0;border-radius:50%;background:#fff;font-size:27px;position:relative;cursor:pointer}
.notify .dot{display:none;position:absolute;right:6px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.navrow{display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border-bottom:1px solid var(--line)}
.navbtn{height:58px;border:0;background:#fff;font-weight:800;font-size:16px;color:#596579;border-bottom:3px solid transparent;cursor:pointer}
.navbtn.active{color:#172033;border-bottom-color:#172033}
.main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);min-height:calc(100vh - 150px)}
.feed{padding:16px;border-right:1px solid var(--line)}
.chat-panel{background:#fff;padding:14px;position:relative}
.section-title{font-size:18px;font-weight:800;margin:3px 0 12px}
.post{
  background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
  overflow:hidden;box-shadow:var(--shadow)
}
.post-head{display:flex;align-items:center;gap:10px;padding:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:#172033;color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-info{flex:1}.user-info b{display:block}.user-info span{font-size:12px;color:var(--muted)}
.more{border:0;background:none;font-size:23px;cursor:pointer}
.post-body{padding:0 13px 12px;white-space:pre-wrap;line-height:1.5}
.post-image{width:100%;max-height:440px;object-fit:cover;display:none;background:#e9edf5}
.post-meta{display:flex;gap:16px;padding:8px 13px;color:var(--muted);font-size:13px;border-top:1px solid #eef1f5}
.actions{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.actions button{height:43px;border:0;background:#fff;color:#667085;font-weight:700;cursor:pointer}
.actions button:hover{background:#f5f7fb}.actions button.liked{color:var(--danger)}
.composer{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;
  box-shadow:var(--shadow)
}
.composer textarea{width:100%;min-height:80px;border:0;outline:0;resize:vertical;font-size:15px;font-family:inherit}
.compose-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef1f5;padding-top:9px}
.file-label{cursor:pointer;font-weight:700;color:#536173}.file-label input{display:none}
.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:9px 17px;font-weight:800;cursor:pointer}
.primary:hover{background:var(--blue2)}
.chat-head{font-weight:800;font-size:18px;padding:4px 3px 12px}
.chat-item{
  display:flex;align-items:center;gap:10px;padding:11px 5px;border-bottom:1px solid #eef1f5;
  cursor:pointer;border-radius:9px
}
.chat-item:hover{background:#f6f8fc}
.chat-item .avatar{width:40px;height:40px}
.chat-text{flex:1}.chat-text b{display:block}.chat-text span{font-size:12px;color:var(--muted)}
.online{width:9px;height:9px;border-radius:50%;background:#31a354}
.settings{
  position:fixed;right:calc((100vw - min(1200px,100vw))/2 + 15px);bottom:15px;
  border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;
  box-shadow:var(--shadow);z-index:30;cursor:pointer
}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,18,35,.45);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{margin-top:0}.close{float:right;border:0;background:#eef1f5;border-radius:50%;width:35px;height:35px;cursor:pointer}
.chat-window{width:min(560px,100%);height:min(680px,90vh);display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;background:#f5f7fb;padding:15px}
.msg{max-width:78%;padding:9px 12px;border-radius:13px;margin:7px 0;line-height:1.4}
.msg.me{margin-left:auto;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.other{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.chat-input{display:flex;gap:8px;padding-top:10px}
.chat-input input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;outline:0;font-family:inherit}
.comment-box{display:none;padding:10px;border-top:1px solid var(--line)}
.comment-box input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;outline:0;font-family:inherit}
.empty{padding:30px;text-align:center;color:var(--muted)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.switch{width:48px;height:27px;border:0;border-radius:20px;background:#ccd3df;position:relative;cursor:pointer}
.switch:after{content:"";position:absolute;width:21px;height:21px;top:3px;left:4px;background:#fff;border-radius:50%;transition:.2s}
.switch.on{background:var(--blue)}.switch.on:after{left:23px}
.logout-btn{background:var(--danger);color:#fff;border:0;border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;margin-top:10px}
.logout-btn:hover{opacity:0.8}
.friend-add-btn{background:var(--blue);color:#fff;border:0;border-radius:40px;padding:4px 14px;font-weight:700;font-size:12px;cursor:pointer}
.friend-add-btn:hover{background:var(--blue2)}
.friend-add-btn.added{background:#9e9e9e;cursor:default}
.search-box{
  background:var(--card);border:1px solid var(--line);border-radius:60px;
  padding:8px 16px;display:flex;align-items:center;gap:10px;margin-bottom:14px
}
.search-box input{flex:1;border:0;outline:0;background:transparent;font-size:14px;color:var(--text)}
.search-box input::placeholder{color:var(--muted)}
@media(max-width:760px){
  .topbar{height:78px;grid-template-columns:70px 1fr 65px;padding:0 10px}
  .logo-profile{width:54px;height:54px;font-size:28px}.brand{font-size:23px}
  .main{display:block}.feed{border-right:0;padding:10px}.chat-panel{display:none}
  .settings{right:12px;bottom:12px}.navbtn{height:52px;font-size:13px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <button class="logo-profile" onclick="openProfile()" aria-label="Profile">
      <span id="topAvatar">M</span><small>PROFILE</small>
    </button>
    <div class="brand">MAJA</div>
    <button class="notify" onclick="showNotifications()" aria-label="Notifications">♧<span class="dot" id="notifyDot"></span></button>
  </header>

  <nav class="navrow">
    <button class="navbtn active" id="threadBtn" onclick="showTab('thread')">THREAD</button>
    <button class="navbtn" id="chartBtn" onclick="showTab('chart')">CHART</button>
    <button class="navbtn" id="friendsBtn" onclick="showTab('friends')">FRIENDS</button>
  </nav>

  <main class="main">
    <section class="feed" id="threadView">
      <div class="composer">
        <textarea id="postText" placeholder="Hello Maja users, type something..."></textarea>
        <div class="compose-row">
          <label class="file-label">📷 Picture
            <input id="postImage" type="file" accept="image/*" onchange="previewImage(event)">
          </label>
          <button class="primary" onclick="createPost()">POST</button>
        </div>
        <img id="preview" class="post-image" alt="Preview">
      </div>
      <div class="section-title">THREAD</div>
      <div id="posts"><div class="empty">Loading posts...</div></div>
    </section>

    <section class="feed" id="friendsView" style="display:none">
      <div class="section-title">👥 FIND FRIENDS</div>
      <div class="search-box">
        <span>🔍</span>
        <input id="searchUsers" placeholder="Search users by username..." oninput="searchUsers()">
      </div>
      <div id="usersList"><div class="empty">Loading users...</div></div>
    </section>

    <aside class="chat-panel" id="chartView">
      <div class="chat-head">💬 CHAT</div>
      <div id="chatList"><div class="empty">Loading chats...</div></div>
    </aside>
  </main>

  <button class="settings" onclick="openSettings()">⚙ SETTING</button>
</div>

<div class="overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ==========================================
// FIREBASE CONFIG
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyARNIMr9CLKIFOt6AONAa4fYz-pe28yX4I",
  authDomain: "maja-ae9d0.firebaseapp.com",
  projectId: "maja-ae9d0",
  storageBucket: "maja-ae9d0.firebasestorage.app",
  messagingSenderId: "21674614341",
  appId: "1:21674614341:web:2f63073f1d0e1c3df04d2c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// ==========================================
// STATE
// ==========================================
let currentUser = null;
let currentUsername = 'User';
let currentAvatar = '';
let currentUserData = {};
let posts = [];
let allUsers = [];
let friendsList = [];
let chatUsers = [];

// ==========================================
// AUTH CHECK
// ==========================================
auth.onAuthStateChanged(async function(user) {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  currentUser = user;
  await loadUserProfile();
  await loadPosts();
  await loadAllUsers();
  await loadFriends();
  await loadChats();
});

// ==========================================
// LOAD USER PROFILE
// ==========================================
async function loadUserProfile() {
  try {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists) {
      currentUserData = doc.data();
      currentUsername = currentUserData.displayName || currentUserData.username || 'User';
      currentAvatar = currentUserData.avatar || '';
    }
    refreshTopAvatar();
  } catch (error) {
    console.error('Error loading profile:', error);
  }
}

// ==========================================
// REFRESH TOP AVATAR
// ==========================================
function refreshTopAvatar() {
  const el = document.getElementById('topAvatar');
  if (!el) return;
  if (currentAvatar) {
    el.innerHTML = `<img src="${currentAvatar}" style="width:100%;height:100%;object-fit:cover;border-radius:18px">`;
  } else {
    el.textContent = currentUsername.charAt(0).toUpperCase();
  }
}

// ==========================================
// GET USERNAME
// ==========================================
function getUsername() { return currentUsername; }
function getAvatar() { return currentAvatar; }

// ==========================================
// LOAD POSTS
// ==========================================
async function loadPosts() {
  const box = document.getElementById('posts');
  try {
    const snapshot = await db.collection('posts')
      .orderBy('createdAt', 'desc')
      .limit(50)
      .get();
    
    posts = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      posts.push({ id: doc.id, ...data });
    });
    renderPosts();
  } catch (error) {
    console.error('Error loading posts:', error);
    box.innerHTML = '<div class="empty">Error loading posts</div>';
  }
}

// ==========================================
// RENDER POSTS
// ==========================================
function renderPosts() {
  const box = document.getElementById('posts');
  if (!posts.length) {
    box.innerHTML = '<div class="empty">Babu post tukuna. Ka fara rubutu!</div>';
    return;
  }
  box.innerHTML = posts.map(p => `
    <article class="post">
      <div class="post-head">
        <div class="avatar">${p.userAvatar ? `<img src="${p.userAvatar}" alt="">` : (p.user || 'U').charAt(0).toUpperCase()}</div>
        <div class="user-info">
          <b>${esc(p.user || 'Unknown')}</b>
          <span>${p.timeAgo || 'just now'}</span>
        </div>
        ${p.userId === currentUser?.uid ? `<button class="more" onclick="deletePost('${p.id}')">⋮</button>` : ''}
      </div>
      <div class="post-body">${esc(p.text || '')}</div>
      ${p.image ? `<img class="post-image" style="display:block" src="${p.image}" alt="Post picture">` : ''}
      <div class="post-meta">
        <span>👁 seen</span>
        <span>${p.likes || 0} likes</span>
        <span>${p.comments || 0} comments</span>
      </div>
      <div class="actions">
        <button class="${p.liked ? 'liked' : ''}" onclick="likePost('${p.id}')">♥ LIKE</button>
        <button onclick="toggleComment('${p.id}')">💬 COMMENT</button>
        <button onclick="repost('${p.id}')">↻ REPOST</button>
      </div>
      <div class="comment-box" id="comment-${p.id}">
        <div style="display:flex;gap:8px">
          <input id="comment-input-${p.id}" style="flex:1;font-family:inherit" placeholder="Write a comment..." onkeydown="if(event.key==='Enter') addComment('${p.id}')">
          <button class="primary" onclick="addComment('${p.id}')">SEND</button>
        </div>
      </div>
    </article>
  `).join('');
}

function esc(s) { return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]); }

// ==========================================
// CREATE POST
// ==========================================
async function createPost() {
  if (!currentUser) { alert('Da fatan ka shiga farko!'); return; }
  const text = document.getElementById('postText').value.trim();
  const preview = document.getElementById('preview');
  const image = preview.dataset.image || '';
  if (!text && !image) { alert('Rubuta message ko saka picture.'); return; }
  
  try {
    await db.collection('posts').add({
      userId: currentUser.uid,
      user: currentUsername,
      userAvatar: currentAvatar,
      text: text || '📷 Picture',
      image: image,
      likes: 0,
      comments: 0,
      reposts: 0,
      liked: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('postText').value = '';
    preview.src = '';
    preview.dataset.image = '';
    preview.style.display = 'none';
    document.getElementById('postImage').value = '';
    await loadPosts();
  } catch (error) {
    alert('Error: ' + error.message);
  }
}

function previewImage(e) {
  const file = e.target.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Zaɓi picture kawai.'); return; }
  const r = new FileReader();
  r.onload = () => {
    const img = document.getElementById('preview');
    img.src = r.result;
    img.dataset.image = r.result;
    img.style.display = 'block';
  };
  r.readAsDataURL(file);
}

// ==========================================
// LIKE POST - FIXED
// ==========================================
async function likePost(id) {
  if (!currentUser) return;
  const p = posts.find(x => x.id === id);
  if (!p) return;
  
  const newLiked = !p.liked;
  const newLikes = p.likes + (newLiked ? 1 : -1);
  
  try {
    await db.collection('posts').doc(id).update({
      likes: newLikes,
      liked: newLiked
    });
    p.liked = newLiked;
    p.likes = newLikes;
    renderPosts();
  } catch (error) {
    console.error('Error liking post:', error);
  }
}

// ==========================================
// REPOST - FIXED
// ==========================================
async function repost(id) {
  if (!currentUser) return;
  const p = posts.find(x => x.id === id);
  if (!p) return;
  
  try {
    await db.collection('posts').doc(id).update({
      reposts: firebase.firestore.FieldValue.increment(1)
    });
    p.reposts = (p.reposts || 0) + 1;
    renderPosts();
    showNotification('✅ An yi repost!');
  } catch (error) {
    console.error('Error reposting:', error);
  }
}

// ==========================================
// COMMENT - FIXED
// ==========================================
async function addComment(id) {
  if (!currentUser) { alert('Da fatan ka shiga farko!'); return; }
  const input = document.getElementById('comment-input-' + id);
  if (!input || !input.value.trim()) return;
  
  const p = posts.find(x => x.id === id);
  if (!p) return;
  
  try {
    await db.collection('posts').doc(id).update({
      comments: firebase.firestore.FieldValue.increment(1)
    });
    p.comments = (p.comments || 0) + 1;
    input.value = '';
    renderPosts();
    showNotification('✅ Comment added!');
  } catch (error) {
    console.error('Error adding comment:', error);
  }
}

function toggleComment(id) {
  const el = document.getElementById('comment-' + id);
  if (el) {
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
    if (el.style.display === 'block') {
      const input = el.querySelector('input');
      if (input) input.focus();
    }
  }
}

// ==========================================
// DELETE POST
// ==========================================
async function deletePost(id) {
  if (!confirm('A goge wannan post?')) return;
  try {
    await db.collection('posts').doc(id).delete();
    await loadPosts();
  } catch (error) {
    alert('Error: ' + error.message);
  }
}

// ==========================================
// LOAD ALL USERS - FOR SEARCH & FRIENDS
// ==========================================
async function loadAllUsers() {
  try {
    const snapshot = await db.collection('users').get();
    allUsers = [];
    snapshot.forEach(doc => {
      if (doc.id !== currentUser?.uid) {
        const data = doc.data();
        allUsers.push({
          id: doc.id,
          username: data.username || data.displayName || 'User',
          displayName: data.displayName || data.username || 'User',
          avatar: data.avatar || ''
        });
      }
    });
    renderUsers(allUsers);
  } catch (error) {
    console.error('Error loading users:', error);
  }
}

// ==========================================
// RENDER USERS - FIXED
// ==========================================
function renderUsers(users) {
  const box = document.getElementById('usersList');
  if (!users || !users.length) {
    box.innerHTML = '<div class="empty">No users found</div>';
    return;
  }
  
  box.innerHTML = users.map(u => {
    const isFriend = friendsList.some(f => f.id === u.id);
    return `
      <div class="chat-item" style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px">
        <div style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer" onclick="viewUserProfile('${u.id}')">
          <div class="avatar">${u.avatar ? `<img src="${u.avatar}" alt="">` : u.displayName.charAt(0).toUpperCase()}</div>
          <div class="chat-text">
            <b>${esc(u.displayName)}</b>
            <span>@${esc(u.username)}</span>
          </div>
        </div>
        <button class="friend-add-btn ${isFriend ? 'added' : ''}" onclick="toggleFriend('${u.id}','${esc(u.displayName)}')">
          ${isFriend ? '✓ FRIEND' : '+ ADD'}
        </button>
      </div>
    `;
  }).join('');
}

// ==========================================
// SEARCH USERS - FIXED
// ==========================================
function searchUsers() {
  const query = document.getElementById('searchUsers').value.toLowerCase().trim();
  if (!query) {
    renderUsers(allUsers);
    return;
  }
  const filtered = allUsers.filter(u => 
    u.displayName.toLowerCase().includes(query) || 
    u.username.toLowerCase().includes(query)
  );
  renderUsers(filtered);
}

// ==========================================
// LOAD FRIENDS
// ==========================================
async function loadFriends() {
  try {
    const snapshot = await db.collection('users').doc(currentUser.uid).collection('friends').get();
    friendsList = [];
    snapshot.forEach(doc => {
      friendsList.push({ id: doc.id, ...doc.data() });
    });
  } catch (error) {
    console.error('Error loading friends:', error);
  }
}

// ==========================================
// TOGGLE FRIEND - FIXED
// ==========================================
async function toggleFriend(userId, userName) {
  if (!currentUser) return;
  
  const isFriend = friendsList.some(f => f.id === userId);
  
  try {
    if (isFriend) {
      // Remove friend
      await db.collection('users').doc(currentUser.uid).collection('friends').doc(userId).delete();
      friendsList = friendsList.filter(f => f.id !== userId);
      showNotification('❌ ' + userName + ' an cire shi daga friends');
    } else {
      // Add friend
      await db.collection('users').doc(currentUser.uid).collection('friends').doc(userId).set({
        name: userName,
        addedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      const userDoc = await db.collection('users').doc(userId).get();
      const userData = userDoc.data();
      friendsList.push({ 
        id: userId, 
        name: userName,
        avatar: userData?.avatar || ''
      });
      showNotification('✅ ' + userName + ' an ƙara shi a friends!');
    }
    renderUsers(allUsers);
  } catch (error) {
    console.error('Error toggling friend:', error);
    alert('Error: ' + error.message);
  }
}

// ==========================================
// VIEW USER PROFILE
// ==========================================
async function viewUserProfile(userId) {
  try {
    const doc = await db.collection('users').doc(userId).get();
    if (!doc.exists) return;
    const data = doc.data();
    const isFriend = friendsList.some(f => f.id === userId);
    
    openSimple(`
      <button class="close" onclick="closeAll()">×</button>
      <h2>👤 ${esc(data.displayName || data.username || 'User')}</h2>
      <div style="text-align:center">
        <div class="avatar" style="width:90px;height:90px;margin:auto;font-size:35px;overflow:hidden">
          ${data.avatar ? `<img src="${data.avatar}" style="width:100%;height:100%;object-fit:cover">` : (data.displayName || 'U').charAt(0).toUpperCase()}
        </div>
      </div>
      <p style="text-align:center;margin-top:10px"><strong>@${esc(data.username || '')}</strong></p>
      <button class="friend-add-btn ${isFriend ? 'added' : ''}" style="width:100%;padding:10px;font-size:16px;border-radius:12px" onclick="toggleFriend('${userId}','${esc(data.displayName || data.username || 'User')}')">
        ${isFriend ? '✓ FRIEND' : '+ ADD FRIEND'}
      </button>
    `);
  } catch (error) {
    console.error('Error viewing user:', error);
  }
}

// ==========================================
// LOAD CHATS
// ==========================================
async function loadChats() {
  try {
    // Load friends for chat
    const snapshot = await db.collection('users').doc(currentUser.uid).collection('friends').get();
    chatUsers = [];
    for (const doc of snapshot.docs) {
      const friendData = doc.data();
      const userDoc = await db.collection('users').doc(doc.id).get();
      const userData = userDoc.data();
      chatUsers.push({
        id: doc.id,
        name: friendData.name || userData?.displayName || 'User',
        avatar: userData?.avatar || '',
        online: Math.random() > 0.5,
        last: 'Hello 👋'
      });
    }
    renderChats();
  } catch (error) {
    console.error('Error loading chats:', error);
  }
}

function renderChats() {
  const box = document.getElementById('chatList');
  if (!chatUsers.length) {
    box.innerHTML = '<div class="empty">No friends yet. Add friends to chat!</div>';
    return;
  }
  box.innerHTML = chatUsers.map(c => `
    <div class="chat-item" onclick="openChat('${c.id}','${esc(c.name)}')">
      <div class="avatar">${c.avatar ? `<img src="${c.avatar}" alt="">` : c.name.charAt(0).toUpperCase()}</div>
      <div class="chat-text"><b>${esc(c.name)}</b><span>${esc(c.last)}</span></div>
      ${c.online ? '<span class="online"></span>' : ''}
    </div>
  `).join('');
}

// ==========================================
// OPEN CHAT
// ==========================================
function openChat(userId, name) {
  const overlay = document.getElementById('modalOverlay'), box = document.getElementById('modalContent');
  overlay.style.display = 'flex';
  box.className = 'modal chat-window';
  box.innerHTML = `
    <div style="padding-bottom:10px;border-bottom:1px solid var(--line)">
      <button class="close" onclick="closeAll()">×</button>
      <b style="font-size:19px">💬 ${esc(name)}</b>
    </div>
    <div class="messages" id="messages">
      <div class="msg other">Sannu 👋</div>
      <div class="msg other">Barka da zuwa MAJA.</div>
    </div>
    <div class="chat-input">
      <input id="chatInput" placeholder="Write message..." onkeydown="if(event.key==='Enter') sendMessage('${esc(name)}')">
      <button class="primary" onclick="sendMessage('${esc(name)}')">SEND</button>
    </div>`;
}

function sendMessage(name) {
  const input = document.getElementById('chatInput');
  if (!input || !input.value.trim()) return;
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg me';
  div.textContent = input.value;
  messages.appendChild(div);
  input.value = '';
  messages.scrollTop = messages.scrollHeight;
  setTimeout(() => {
    const r = document.createElement('div');
    r.className = 'msg other';
    r.textContent = 'Okay, na gani 👍';
    messages.appendChild(r);
    messages.scrollTop = messages.scrollHeight;
  }, 700);
}

// ==========================================
// CHANGE PROFILE PICTURE - FIXED
// ==========================================
async function changeProfilePicture(e) {
  const file = e.target.files[0]; 
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = async function(event) {
    const imageData = event.target.result;
    currentAvatar = imageData;
    
    try {
      await db.collection('users').doc(currentUser.uid).update({ 
        avatar: imageData 
      });
      
      const avatarEl = document.getElementById('profileAvatar');
      if (avatarEl) {
        avatarEl.innerHTML = `<img src="${imageData}" style="width:100%;height:100%;object-fit:cover">`;
      }
      refreshTopAvatar();
      showNotification('✅ Avatar an canza!');
    } catch (error) {
      console.error('Error saving avatar:', error);
      alert('Error: ' + error.message);
    }
  };
  reader.readAsDataURL(file);
}

// ==========================================
// SAVE PROFILE - FIXED
// ==========================================
async function saveProfile() {
  const input = document.getElementById('usernameInput');
  const name = (input.value || '').trim();
  if (!name) { alert('Saka username.'); return; }
  
  // Check if username is taken
  if (name.toLowerCase() !== currentUsername.toLowerCase()) {
    try {
      const usernameRef = db.collection('usernames').doc(name.toLowerCase());
      const existing = await usernameRef.get();
      if (existing.exists && existing.data().uid !== currentUser.uid) {
        alert('⚠️ Wannan username an riga an dauka!');
        return;
      }
      // Update username
      await usernameRef.set({ uid: currentUser.uid, username: name.toLowerCase() });
    } catch (error) {
      alert('Error: ' + error.message);
      return;
    }
  }
  
  currentUsername = name;
  try {
    await db.collection('users').doc(currentUser.uid).update({ 
      displayName: name,
      username: name.toLowerCase()
    });
    refreshTopAvatar();
    closeAll();
    await loadPosts();
    await loadAllUsers();
    showNotification('✅ Profile an gyara!');
  } catch (error) {
    alert('Error: ' + error.message);
  }
}

function showNotification(msg) {
  const notif = document.getElementById('notification');
  if (notif) {

    notif.style.display = 'block';
    setTimeout(() => { notif.style.display = 'none'; }, 3000);
  } else {

  }
}

function toggleDark(btn) {
  btn.classList.toggle('on');
  document.body.classList.toggle('dark');
  if (document.body.classList.contains('dark')) {
    document.documentElement.style.setProperty('--bg','#0e1420');
    document.documentElement.style.setProperty('--card','#151d2b');
    document.documentElement.style.setProperty('--line','#2a3446');
    document.documentElement.style.setProperty('--text','#f2f5fa');
  } else {
    document.documentElement.style.setProperty('--bg','#f5f7fb');
    document.documentElement.style.setProperty('--card','#fff');
    document.documentElement.style.setProperty('--line','#dfe4ec');
    document.documentElement.style.setProperty('--text','#172033');
  }
}
