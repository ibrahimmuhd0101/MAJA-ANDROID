<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f7fb;--card:#fff;--line:#dfe4ec;--text:#172033;--muted:#718096;
  --blue:#315efb;--blue2:#2448cf;--danger:#e34b4b;--shadow:0 8px 25px rgba(20,35,70,.07)
}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:auto;min-height:100vh;background:var(--bg)}
.topbar{
  height:92px;background:var(--card);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:0 18px;
  position:sticky;top:0;z-index:20
}
.logo-profile{
  width:64px;height:64px;border:2px solid #202b44;border-radius:18px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;
  font-size:32px;line-height:25px
}
.logo-profile small{font-size:10px;font-weight:700}
.brand{text-align:center;font-size:30px;font-weight:800;letter-spacing:4px}
.notify{justify-self:end;width:52px;height:52px;border:0;border-radius:50%;background:#fff;font-size:27px;position:relative}
.notify .dot{display:none;position:absolute;right:6px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.navrow{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:1px solid var(--line)}
.navbtn{height:58px;border:0;background:#fff;font-weight:800;font-size:18px;color:#596579;border-bottom:3px solid transparent}
.navbtn.active{color:#172033;border-bottom-color:#172033}
.main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);min-height:calc(100vh - 150px)}
.feed{padding:16px;border-right:1px solid var(--line)}
.chat-panel{background:#fff;padding:14px;position:relative}
.section-title{font-size:18px;font-weight:800;margin:3px 0 12px}
.post{
  background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
  overflow:hidden;box-shadow:var(--shadow)
}
.post-head{display:flex;align-items:center;gap:10px;padding:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:#172033;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.user-info{flex:1}.user-info b{display:block}.user-info span{font-size:12px;color:var(--muted)}
.more{border:0;background:none;font-size:23px}
.post-body{padding:0 13px 12px;white-space:pre-wrap;line-height:1.5}
.post-image{width:100%;max-height:440px;object-fit:cover;display:none;background:#e9edf5}
.post-meta{display:flex;gap:16px;padding:8px 13px;color:var(--muted);font-size:13px;border-top:1px solid #eef1f5}
.actions{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.actions button{height:43px;border:0;background:#fff;color:#667085;font-weight:700}
.actions button:hover{background:#f5f7fb}.actions button.liked{color:var(--danger)}
.composer{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;
  box-shadow:var(--shadow)
}
.composer textarea{width:100%;min-height:80px;border:0;outline:0;resize:vertical;font-size:15px}
.compose-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef1f5;padding-top:9px}
.file-label{cursor:pointer;font-weight:700;color:#536173}.file-label input{display:none}
.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:9px 17px;font-weight:800}
.primary:hover{background:var(--blue2)}
.chat-head{font-weight:800;font-size:18px;padding:4px 3px 12px}
.chat-item{
  display:flex;align-items:center;gap:10px;padding:11px 5px;border-bottom:1px solid #eef1f5;
  cursor:pointer;border-radius:9px
}
.chat-item:hover{background:#f6f8fc}
.chat-item .avatar{width:40px;height:40px}
.chat-text{flex:1}.chat-text b{display:block}.chat-text span{font-size:12px;color:var(--muted)}
.online{width:9px;height:9px;border-radius:50%;background:#31a354}
.settings{
  position:fixed;right:calc((100vw - min(1200px,100vw))/2 + 15px);bottom:15px;
  border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;
  box-shadow:var(--shadow);z-index:30
}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,18,35,.45);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{margin-top:0}.close{float:right;border:0;background:#eef1f5;border-radius:50%;width:35px;height:35px}
.chat-window{width:min(560px,100%);height:min(680px,90vh);display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;background:#f5f7fb;padding:15px}
.msg{max-width:78%;padding:9px 12px;border-radius:13px;margin:7px 0;line-height:1.4}
.msg.me{margin-left:auto;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.other{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.chat-input{display:flex;gap:8px;padding-top:10px}
.chat-input input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;outline:0}
.comment-box{display:none;padding:10px;border-top:1px solid var(--line)}
.comment-box input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;outline:0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.switch{width:48px;height:27px;border:0;border-radius:20px;background:#ccd3df;position:relative}
.switch:after{content:"";position:absolute;width:21px;height:21px;top:3px;left:4px;background:#fff;border-radius:50%;transition:.2s}
.switch.on{background:var(--blue)}.switch.on:after{left:23px}
@media(max-width:760px){
  .topbar{height:78px;grid-template-columns:70px 1fr 65px;padding:0 10px}
  .logo-profile{width:54px;height:54px;font-size:28px}.brand{font-size:23px}
  .main{display:block}.feed{border-right:0;padding:10px}.chat-panel{display:none}
  .settings{right:12px;bottom:12px}.navbtn{height:52px;font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="logo-profile" onclick="openProfile()" aria-label="Profile"><span id="topAvatar">M</span><small>PROFILE</small></button>
    <div class="brand">MAJA</div>
    <button class="notify" onclick="showNotifications()" aria-label="Notifications">♧<span class="dot" id="notifyDot"></span></button>
  </header>

  <nav class="navrow">
    <button class="navbtn active" id="threadBtn" onclick="showTab('thread')">THREAD</button>
    <button class="navbtn" id="chartBtn" onclick="showTab('chart')">CHART</button>
  </nav>

  <main class="main">
    <section class="feed" id="threadView">
      <div class="composer">
        <textarea id="postText" placeholder="Hello Maja users, type something..."></textarea>
        <div class="compose-row">
          <label class="file-label">📷 Picture
            <input id="postImage" type="file" accept="image/*" onchange="previewImage(event)">
          </label>
          <button class="primary" onclick="createPost()">POST</button>
        </div>
        <img id="preview" class="post-image" alt="Preview">
      </div>
      <div class="section-title">THREAD</div>
      <div id="posts"></div>
    </section>

    <aside class="chat-panel" id="chartView">
      <div class="chat-head">CHART</div>
      <div id="chatList"></div>
    </aside>
  </main>

  <button class="settings" onclick="openSettings()">⚙ SETTING</button>
</div>

<div class="overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const KEY_POSTS='maja_posts_v1';
const KEY_NOTES='maja_notes_v1';

let posts = JSON.parse(localStorage.getItem(KEY_POSTS) || 'null') || [
  {id:1,user:'Hasan',text:'Hello Maja users, I am new here\\nPicture hai 👋',image:'',likes:3,comments:1,reposts:0,liked:false},
  {id:2,user:'Aisha',text:'Hello Maja, lemu tare da ku ❤️',image:'',likes:7,comments:2,reposts:1,liked:false}
];

const chats=[
  {name:'Husna',letter:'H',online:true,last:'Hello, ya ya aiki?'},
  {name:'Musa',letter:'M',online:false,last:'Audio message'},
  {name:'Ali',letter:'A',online:true,last:'Okay 👍'},
  {name:'Isa',letter:'I',online:false,last:'Picture'}
];

function save(){localStorage.setItem(KEY_POSTS,JSON.stringify(posts))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function renderPosts(){
  const box=document.getElementById('posts');
  if(!posts.length){box.innerHTML='<div class="empty">Babu post tukuna.</div>';return}
  box.innerHTML=posts.map(p=>`
    <article class="post">
      <div class="post-head">
        <div class="avatar">${esc(p.user.charAt(0).toUpperCase())}</div>
        <div class="user-info"><b>${esc(p.user)}</b><span>just now</span></div>
        <button class="more" onclick="deletePost(${p.id})">⋮</button>
      </div>
      <div class="post-body">${esc(p.text)}</div>
      ${p.image?`<img class="post-image" style="display:block" src="${p.image}" alt="Post picture">`:''}
      <div class="post-meta"><span>👁 seen</span><span>${p.likes} likes</span><span>${p.comments} comments</span></div>
      <div class="actions">
        <button class="${p.liked?'liked':''}" onclick="likePost(${p.id})">♥ LIKE</button>
        <button onclick="toggleComment(${p.id})">💬 COMMENT</button>
        <button onclick="repost(${p.id})">↻ REPOST</button>
      </div>
      <div class="comment-box" id="comment-${p.id}">
        <div style="display:flex;gap:8px">
          <input id="comment-input-${p.id}" style="flex:1" placeholder="Write a comment..." onkeydown="if(event.key==='Enter') addComment(${p.id},this)">
          <button class="primary" onclick="addComment(${p.id},document.getElementById('comment-input-${p.id}'))">SEND</button>
        </div>
      </div>
    </article>
  `).join('');
}
function createPost(){
  const text=document.getElementById('postText').value.trim();
  const preview=document.getElementById('preview');
  const image=(preview.dataset.image || '').trim();
  if(!text && !image){alert('Rubuta message ko saka picture.');return}
  posts.unshift({
    id:Date.now(),user:getUsername(),text,image,
    likes:0,comments:0,reposts:0,liked:false
  });
  save();
  document.getElementById('postText').value='';
  preview.src='';
  preview.dataset.image='';
  preview.style.display='none';
  document.getElementById('postImage').value='';
  renderPosts();
}
function previewImage(e){
  const file=e.target.files[0]; if(!file)return;
  if(!file.type.startsWith('image/')){alert('Zaɓi picture kawai.');return}
  const r=new FileReader();
  r.onload=()=>{
    const img=document.getElementById('preview');
    img.src=r.result;
    img.dataset.image=r.result;
    img.style.display='block';
  };
  r.readAsDataURL(file);
}
function likePost(id){const p=posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;save();renderPosts()}
function repost(id){const p=posts.find(x=>x.id===id);if(!p)return;p.reposts++;alert('An yi repost.');save();renderPosts()}
function toggleComment(id){const el=document.getElementById('comment-'+id);el.style.display=el.style.display==='block'?'none':'block';if(el.style.display==='block')el.querySelector('input').focus()}
function addComment(id,input){if(!input.value.trim())return;const p=posts.find(x=>x.id===id);p.comments++;input.value='';save();renderPosts();alert('Comment added.')}
function deletePost(id){if(confirm('A goge wannan post?')){posts=posts.filter(p=>p.id!==id);save();renderPosts()}}
function showTab(tab){
  const thread=tab==='thread';
  document.getElementById('threadView').style.display=thread?'block':'none';
  document.getElementById('chartView').style.display=thread?'none':'block';
  document.getElementById('threadBtn').classList.toggle('active',thread);
  document.getElementById('chartBtn').classList.toggle('active',!thread);
}
function renderChats(){
  document.getElementById('chatList').innerHTML=chats.map(c=>`
    <div class="chat-item" onclick="openChat('${esc(c.name)}','${esc(c.letter)}')">
      <div class="avatar">${esc(c.letter)}</div>
      <div class="chat-text"><b>${esc(c.name)}</b><span>${esc(c.last)}</span></div>
      ${c.online?'<span class="online"></span>':''}
    </div>`).join('');
}
function openChat(name,letter){
  const overlay=document.getElementById('modalOverlay'),box=document.getElementById('modalContent');
  overlay.style.display='flex';
  box.className='modal chat-window';
  box.innerHTML=`
    <div style="padding-bottom:10px;border-bottom:1px solid var(--line)">
      <button class="close" onclick="closeAll()">×</button><b style="font-size:19px">${esc(name)}</b>
    </div>
    <div class="messages" id="messages">
      <div class="msg other">Sannu 👋</div><div class="msg other">Barka da zuwa MAJA.</div>
    </div>
    <div class="chat-input">
      <input id="chatInput" placeholder="Write message..." onkeydown="if(event.key==='Enter')sendMessage('${esc(name)}')">
      <button class="primary" onclick="sendMessage('${esc(name)}')">SEND</button>
    </div>`;
}
function sendMessage(name){
  const input=document.getElementById('chatInput');if(!input.value.trim())return;
  const messages=document.getElementById('messages');
  const div=document.createElement('div');div.className='msg me';div.textContent=input.value;messages.appendChild(div);input.value='';messages.scrollTop=messages.scrollHeight;
  setTimeout(()=>{const r=document.createElement('div');r.className='msg other';r.textContent='Okay, na gani 👍';messages.appendChild(r);messages.scrollTop=messages.scrollHeight},700);
}
function getUsername(){return localStorage.getItem('maja_username') || 'You'}
function getAvatar(){return localStorage.getItem('maja_avatar') || ''}
function openProfile(){
  const avatar=getAvatar();
  openSimple(`
    <button class="close" onclick="closeAll()">×</button>
    <h2>MAJA PROFILE</h2>
    <div style="text-align:center">
      <div id="profileAvatar" class="avatar" style="width:90px;height:90px;margin:auto;font-size:35px;overflow:hidden">
        ${avatar ? `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover">` : esc(getUsername().charAt(0).toUpperCase())}
      </div>
      <br>
      <label class="file-label">
        📷 Change picture
        <input type="file" accept="image/*" onchange="changeProfilePicture(event)">
      </label>
    </div>
    <label style="display:block;margin-top:18px;font-weight:700">Username</label>
    <input id="usernameInput" value="${esc(getUsername())}" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin-top:7px;outline:0">
    <button class="primary" style="width:100%;margin-top:14px" onclick="saveProfile()">SAVE PROFILE</button>
  `);
}
function changeProfilePicture(e){
  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    localStorage.setItem('maja_avatar',r.result);
    const a=document.getElementById('profileAvatar');
    if(a)a.innerHTML=`<img src="${r.result}" style="width:100%;height:100%;object-fit:cover">`;
  };
  r.readAsDataURL(file);
}
function saveProfile(){
  const input=document.getElementById('usernameInput');
  const name=(input.value||'').trim();
  if(!name){alert('Saka username.');return}
  localStorage.setItem('maja_username',name);
  refreshTopAvatar();
  renderPosts();
  closeAll();
}
function showNotifications(){
  document.getElementById('notifyDot').style.display='none';
  openSimple('<button class="close" onclick="closeAll()">×</button><h2>NOTIFICATION</h2><p>❤️ Someone liked your post.</p><p>💬 You have a new comment.</p><p>↻ Your post was reposted.</p>');
}
function openSettings(){
  openSimple(`<button class="close" onclick="closeAll()">×</button><h2>SETTING</h2>
  <div class="setting-row"><span>Notifications</span><button class="switch on" onclick="this.classList.toggle('on')"></button></div>
  <div class="setting-row"><span>Sound</span><button class="switch on" onclick="this.classList.toggle('on')"></button></div>
  <div class="setting-row"><span>Dark mode</span><button class="switch" onclick="toggleDark(this)"></button></div>
  <div class="setting-row"><span>Clear local data</span><button class="primary" onclick="clearData()">CLEAR</button></div>`);
}
function toggleDark(btn){
  btn.classList.toggle('on');document.body.classList.toggle('dark');
  if(document.body.classList.contains('dark')){
    document.documentElement.style.setProperty('--bg','#0e1420');document.documentElement.style.setProperty('--card','#151d2b');
    document.documentElement.style.setProperty('--line','#2a3446');document.documentElement.style.setProperty('--text','#f2f5fa');
  }else{
    document.documentElement.style.setProperty('--bg','#f5f7fb');document.documentElement.style.setProperty('--card','#fff');
    document.documentElement.style.setProperty('--line','#dfe4ec');document.documentElement.style.setProperty('--text','#172033');
  }
}
function clearData(){if(confirm('A share duk bayanan MAJA da aka ajiye a wannan browser?')){localStorage.removeItem(KEY_POSTS);location.reload()}}
function openSimple(html){const o=document.getElementById('modalOverlay'),b=document.getElementById('modalContent');o.style.display='flex';b.className='modal';b.innerHTML=html}
function closeAll(){document.getElementById('modalOverlay').style.display='none'}
function closeModal(e){if(e.target.id==='modalOverlay')closeAll()}

function refreshTopAvatar(){
  const el=document.getElementById('topAvatar');
  if(!el)return;
  const avatar=getAvatar();
  if(avatar) el.innerHTML=`<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`;
  else el.textContent=getUsername().charAt(0).toUpperCase();
}
refreshTopAvatar();
renderPosts();renderChats();
</script>
</body>
</html>
