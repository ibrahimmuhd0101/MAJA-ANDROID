<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA - Login</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5;font-family:'Segoe UI',Arial,sans-serif}
.container{background:#fff;padding:40px 32px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,0.1);width:100%;max-width:400px}
.logo{text-align:center;font-size:40px;font-weight:900;letter-spacing:4px;margin-bottom:4px}
.logo span{color:#2563eb}
.subtitle{text-align:center;color:#6b7280;font-size:15px;margin-bottom:24px}
.tabs{display:flex;background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:24px}
.tabs button{flex:1;padding:10px;border:none;background:transparent;border-radius:9px;font-weight:700;font-size:15px;color:#6b7280;cursor:pointer}
.tabs button.active{background:#fff;color:#1a1a2e;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.field input{width:100%;padding:12px 14px;border:1px solid #e0e0e0;border-radius:10px;outline:none;font-size:15px}
.field input:focus{border-color:#2563eb}
.btn{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer}
.btn:hover{background:#1d4ed8}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.message{text-align:center;margin-top:12px;font-size:14px;min-height:22px}
.message.error{color:#dc2626}
.message.ok{color:#16a34a}
.footer{text-align:center;margin-top:20px;color:#9ca3af;font-size:12px}
</style>
</head>
<body>

<div class="container">
  <div class="logo">MAJA<span>.</span></div>
  <div class="subtitle" id="subtitle">Welcome to MAJA</div>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="setMode('login')">Log In</button>
    <button id="tabSignup" onclick="setMode('signup')">Sign Up</button>
  </div>

  <div class="field">
    <label>Username</label>
    <input id="username" type="text" placeholder="e.g. husna23">
  </div>
  <div class="field">
    <label>Password</label>
    <input id="password" type="password" placeholder="Min 6 characters">
  </div>
  <div class="field" id="confirmWrap" style="display:none">
    <label>Confirm Password</label>
    <input id="confirmPassword" type="password" placeholder="Confirm your password">
  </div>

  <button class="btn" id="submitBtn" onclick="submitForm()">Continue</button>
  <div class="message" id="message"></div>

  <div class="footer">MAJA Social Media</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyARNIMr9CLKIFOt6AONAa4fYz-pe28yX4I",
  authDomain: "maja-ae9d0.firebaseapp.com",
  projectId: "maja-ae9d0",
  storageBucket: "maja-ae9d0.firebasestorage.app",
  messagingSenderId: "21674614341",
  appId: "1:21674614341:web:2f63073f1d0e1c3df04d2c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let mode = 'login';

auth.onAuthStateChanged(function(user) {
  if (user) window.location.href = 'index.html';
});

function setMode(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabSignup').classList.toggle('active', m === 'signup');
  document.getElementById('confirmWrap').style.display = m === 'signup' ? 'block' : 'none';
  document.getElementById('subtitle').textContent = m === 'signup' ? 'Create your account' : 'Welcome back!';
  document.getElementById('submitBtn').textContent = m === 'signup' ? 'Create Account' : 'Continue';
  setMessage('');
}

function setMessage(text, type) {
  const el = document.getElementById('message');
  el.textContent = text || '';
  el.className = 'message' + (type ? ' ' + type : '');
}

function normalizeUsername(raw) {
  return raw.trim().toLowerCase().replace(/[^a-z0-9_.]/g, '');
}

function usernameToEmail(u) { return u + '@maja.local'; }

async function submitForm() {
  const raw = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirmPassword').value;
  const username = normalizeUsername(raw);
  const btn = document.getElementById('submitBtn');

  if (!username || username.length < 3) {
    setMessage('Username must be at least 3 characters (a-z, 0-9, _)', 'error');
    return;
  }
  if (!password || password.length < 6) {
    setMessage('Password must be at least 6 characters', 'error');
    return;
  }
  if (mode === 'signup' && password !== confirm) {
    setMessage('Passwords do not match', 'error');
    return;
  }

  btn.disabled = true;
  setMessage('Processing...', '');
  const email = usernameToEmail(username);

  try {
    if (mode === 'signup') {
      const existing = await db.collection('usernames').doc(username).get();
      if (existing.exists) {
        setMessage('This username is already taken', 'error');
        btn.disabled = false;
        return;
      }
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await db.collection('usernames').doc(username).set({ uid: cred.user.uid, username });
      await db.collection('users').doc(cred.user.uid).set({
        username, displayName: raw.trim(), avatar: '', gender: 'Male',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setMessage('Account created!', 'ok');
    } else {
      await auth.signInWithEmailAndPassword(email, password);
      setMessage('Logged in!', 'ok');
    }
    setTimeout(() => window.location.href = 'index.html', 500);
  } catch (err) {
    btn.disabled = false;
    const code = err.code || '';
    if (code === 'auth/email-already-in-use') setMessage('Username already taken', 'error');
    else if (code === 'auth/user-not-found' || code === 'auth/wrong-password') setMessage('Invalid username or password', 'error');
    else if (code === 'auth/network-request-failed') setMessage('No internet connection', 'error');
    else setMessage('Error: ' + (err.message || 'Please try again'), 'error');
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitForm();
});
</script>

</body>
</html>
